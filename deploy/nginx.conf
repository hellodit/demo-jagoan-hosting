# /etc/nginx/sites-available/redis-cache-demo
# certbot --nginx menambahkan blok HTTPS (443) ke file ini.

upstream redis_cache_demo {
    server 172.28.0.10:8080;   # kontainer app, lihat docker-compose.yml
    # Koneksi ke app dipakai ulang. Tanpa ini, setiap request membuka
    # koneksi TCP baru dan nginx sendiri yang jadi bottleneck saat load test.
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.asditaprasetya.com;

    access_log /var/log/nginx/redis-cache-demo.access.log combined buffer=64k flush=5s;

    location / {
        proxy_pass http://redis_cache_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
